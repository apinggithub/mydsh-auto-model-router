# mydsh-auto-model-router — the cordis patch layer. Mounts the router inside an
# isolated group; the runtime registers model-facing hooks on agent scopes.
- insert:
    - id: mydsh-auto-model-router
      name: '@deepseek-ai/cordis-plugin-group'
      group: true
      isolate:
        modelRouter: true
      config:
        - id: mydsh-auto-model-router-runtime
          name: '@apinggithub/mydsh-auto-model-router'
